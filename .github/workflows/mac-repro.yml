# macOS reproduction for a tangency-labs/solidcraft issue: the official macOS CLI runs the issue's
# attachments (and an optional command script). Started by hand or by the triage agents:
#   gh workflow run mac-repro.yml -R dudedagger42/solidcraft -f issue=N [-f version=0.24.0] [-f script="$(cat s.json)"]
# Attachments are untrusted data: no token is available to the step that runs them.
name: macOS repro
run-name: "macOS repro #${{ inputs.issue }}"

on:
  workflow_dispatch:
    inputs:
      issue:
        description: tangency-labs/solidcraft issue number
        required: true
      version:
        description: Official release to test (e.g. 0.24.0); empty for the latest
        required: false
        default: ""
      script:
        description: Optional command script (JSON text) to run, on the attached design if there is one
        required: false
        default: ""

permissions:
  contents: read

jobs:
  repro:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github/mac-repro

      - name: Official macOS CLI
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [ -z "$VERSION" ]; then VERSION=$(gh release view -R tangency-labs/solidcraft --json tagName -q .tagName | sed 's/^v//'); fi
          case "$VERSION" in *[!0-9A-Za-z.-]*|"") echo "bad version: $VERSION"; exit 1;; esac
          mkdir -p "$RUNNER_TEMP/cli"
          gh release download "v$VERSION" -R tangency-labs/solidcraft -p "solidcraft-cli-$VERSION-macos-universal.zip" -D "$RUNNER_TEMP/cli"
          unzip -q "$RUNNER_TEMP/cli/"*.zip -d "$RUNNER_TEMP/cli/x"
          EXE=$(find "$RUNNER_TEMP/cli/x" -type f -name solidcraft-cli | head -1)
          chmod +x "$EXE"
          "$EXE" --version
          echo "SOLIDCRAFT_CLI=$EXE" >> "$GITHUB_ENV"

      - name: Download the issue's attachments
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ inputs.issue }}
        run: python3 -I .github/mac-repro/replay.py fetch "$ISSUE" "$RUNNER_TEMP/work"

      - name: Run on macOS (no token)
        env:
          ISSUE: ${{ inputs.issue }}
          SCRIPT: ${{ inputs.script }}
        run: python3 -I .github/mac-repro/replay.py run "$ISSUE" "$RUNNER_TEMP/work"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-repro-${{ inputs.issue }}
          path: ${{ runner.temp }}/work/results
          if-no-files-found: ignore
